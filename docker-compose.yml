version: '3.8'

services:
  api:
    build: .
    container_name: ml_api_tech_challenge
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    networks:
      - monitoring_net
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring_net
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

networks:
  monitoring_net:
    driver: bridge